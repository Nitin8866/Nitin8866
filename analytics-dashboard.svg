<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400" role="img" aria-label="Analytics &amp; Metrics Dashboard — Language Distribution &amp; Contribution Pulse">
  <defs>
    
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="anBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="65%" stop-color="#15141F"/><stop offset="100%" stop-color="#1E1714"/>
    </linearGradient>
    <linearGradient id="anBgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="65%" stop-color="#101824"/><stop offset="100%" stop-color="#0D201D"/>
    </linearGradient>
    <linearGradient id="anBdL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.52"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="anBdR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.52"/><stop offset="100%" stop-color="#10B981" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/><stop offset="45%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="waveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chartScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="anClipL"><rect x="0" y="6" width="536" height="386" rx="18"/></clipPath>
    <clipPath id="anClipR"><rect x="564" y="6" width="836" height="386" rx="18"/></clipPath>
    <clipPath id="plotClip"><rect x="618" y="152" width="752" height="190" rx="8"/></clipPath>
    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes scanChart { 0% { transform: translateX(-140px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(780px); opacity: 0; } }
      @keyframes nPulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.65); opacity: 0.7; } }
      @keyframes swL { 0%, 100% { transform: translateX(-580px); } 35% { transform: translateX(580px); } }
      .spinOrbit { transform-box: fill-box; transform-origin: center; animation: orbitSpin 26s linear infinite; }
      .chartBeam { animation: scanChart 5.5s ease-in-out infinite; }
      .nodePulse0 { transform-box: fill-box; transform-origin: center; animation: nPulse 2.4s ease-in-out 0.0s infinite; }
      .nodePulse1 { transform-box: fill-box; transform-origin: center; animation: nPulse 2.4s ease-in-out 0.8s infinite; }
      .nodePulse2 { transform-box: fill-box; transform-origin: center; animation: nPulse 2.4s ease-in-out 1.6s infinite; }
      .swL { animation: swL 8s ease-in-out infinite; }
    ]]></style>
