<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 392" width="1400" height="392" role="img" aria-label="Project Setup &amp; Installation Guide Terminal">
  <defs>
    
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1017"/><stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="termBd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.48"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.48"/>
    </linearGradient>
    <clipPath id="termClip"><rect x="0" y="6" width="1400" height="380" rx="18"/></clipPath>
    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      @keyframes blinkCur { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes termSweep { 0%, 100% { transform: translateX(-1400px); } 28% { transform: translateX(1400px); } }
      .cur { animation: blinkCur 1.1s step-end infinite; }
      .tsw { animation: termSweep 9s ease-in-out infinite; }
    ]]></style>
  </defs>

  <g filter="url(#cardShadow)">
    <g clip-path="url(#termClip)">
      <rect x="0" y="6" width="1400" height="380" rx="18" fill="url(#termBg)"/>
      <rect x="0" y="6" width="1400" height="48" fill="#161D2A"/>
      <line x1="0" y1="54" x2="1400" y2="54" stroke="#334155" stroke-opacity="0.45" stroke-width="1"/>
      <rect class="tsw" x="0" y="6" width="1400" height="380" fill="url(#sheenGrad)"/>
    </g>
    <rect x="0.75" y="6.75" width="1398.5" height="378.5" rx="17.5" fill="none" stroke="url(#termBd)" stroke-width="1.5"/>

    <!-- Window chrome -->
    <circle cx="30" cy="30" r="6" fill="#FF5F56"/>
    <circle cx="50" cy="30" r="6" fill="#FFBD2E"/>
    <circle cx="70" cy="30" r="6" fill="#27C93F"/>
    <text x="98" y="34" class="mono" font-size="13" font-weight="700" fill="#94A3B8">nitin@portfolio: ~/Nitin8866 — quickstart.sh</text>

    
    <rect x="836" y="18" width="74" height="24" rx="7" fill="#0B1018" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="873.0" y="34" class="mono" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">PHP 8.x</text>
    <rect x="918" y="18" width="82" height="24" rx="7" fill="#0B1018" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1"/>
    <text x="959.0" y="34" class="mono" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">Composer</text>
    <rect x="1008" y="18" width="90" height="24" rx="7" fill="#0B1018" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
    <text x="1053.0" y="34" class="mono" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Node v18+</text>
    <rect x="1106" y="18" width="58" height="24" rx="7" fill="#0B1018" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="1135.0" y="34" class="mono" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">MySQL</text>
    <rect x="1172" y="18" width="106" height="24" rx="7" fill="#0B1018" stroke="#0EA5E9" stroke-opacity="0.45" stroke-width="1"/>
    <text x="1225.0" y="34" class="mono" font-size="11" font-weight="700" fill="#0EA5E9" text-anchor="middle">Flutter SDK</text>

    <!-- Left Terminal Sub-pane -->
    <rect x="24" y="74" width="664" height="290" rx="14" fill="#090D14" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.2"/>
    <rect x="42" y="90" width="234" height="24" rx="7" fill="#0F1C2A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="159" y="106" class="mono" font-size="11.5" font-weight="800" fill="#38BDF8" text-anchor="middle">01 · CLONE &amp; BACKEND INIT</text>

    <text x="44" y="142" class="mono" font-size="13.5" fill="#64748B"># Step 1 &amp; 2 — Prerequisites &amp; Repository Clone</text>
    <text x="44" y="170" class="mono" font-size="14" font-weight="700" fill="#34D399">$ <tspan fill="#E2E8F0">git clone </tspan><tspan fill="#38BDF8">https://github.com/Nitin8866/Nitin8866.git</tspan></text>
    <text x="44" y="196" class="mono" font-size="14" font-weight="700" fill="#34D399">$ <tspan fill="#E2E8F0">cd </tspan><tspan fill="#FBBF24">Nitin8866</tspan></text>

    <text x="44" y="236" class="mono" font-size="13.5" fill="#64748B"># Step 3 — Laravel Backend Dependencies</text>
    <text x="44" y="264" class="mono" font-size="14" font-weight="700" fill="#34D399">$ <tspan fill="#E2E8F0">composer install</tspan></text>
    <text x="44" y="292" class="mono" font-size="14" font-weight="700" fill="#34D399">$ <tspan fill="#E2E8F0">cp </tspan><tspan fill="#FB7185">.env.example .env</tspan></text>
    <text x="44" y="320" class="mono" font-size="14" font-weight="700" fill="#34D399">$ <tspan fill="#E2E8F0">php artisan </tspan><tspan fill="#FBBF24">key:generate</tspan></text>
    <text x="44" y="346" class="mono" font-size="12.5" fill="#10B981">[OK] Application key set &amp; environment initialized.</text>

    <!-- Right Terminal Sub-pane -->
    <rect x="712" y="74" width="664" height="290" rx="14" fill="#090D14" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1.2"/>
    <rect x="730" y="90" width="234" height="24" rx="7" fill="#21180E" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
    <text x="847" y="106" class="mono" font-size="11.5" font-weight="800" fill="#FBBF24" text-anchor="middle">02 · FRONTEND &amp; DEV SERVERS</text>

    <text x="732" y="142" class="mono" font-size="13.5" fill="#64748B"># Step 3B — Node.js &amp; React Packages</text>
    <text x="732" y="170" class="mono" font-size="14" font-weight="700" fill="#FBBF24">$ <tspan fill="#E2E8F0">npm install</tspan></text>
    <text x="732" y="196" class="mono" font-size="12.5" fill="#94A3B8">added 428 packages in 4.2s — audited 0 vulnerabilities</text>

    <text x="732" y="236" class="mono" font-size="13.5" fill="#64748B"># Step 4 — Launch Laravel &amp; Vite Development Servers</text>
    <text x="732" y="264" class="mono" font-size="14" font-weight="700" fill="#FBBF24">$ <tspan fill="#E2E8F0">php artisan serve</tspan></text>
    <text x="732" y="288" class="mono" font-size="12.5" fill="#34D399">  INFO  Server running on [http://127.0.0.1:8000]</text>
    <text x="732" y="318" class="mono" font-size="14" font-weight="700" fill="#FBBF24">$ <tspan fill="#E2E8F0">npm run dev</tspan></text>
    <text x="732" y="344" class="mono" font-size="12.5" fill="#38BDF8">  VITE v5.x  ready in 240 ms  &#8594;  http://localhost:5173</text>
    <rect x="1158" y="331" width="9" height="16" rx="1.5" fill="#34D399" class="cur"/>
  </g>
</svg>
