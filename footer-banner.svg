<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 182" width="1400" height="182" role="img" aria-label="Nitin Maharaj — Full Stack Developer Closing Banner">
  <defs>
    
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="50%" stop-color="#111722"/><stop offset="100%" stop-color="#16141F"/>
    </linearGradient>
    <linearGradient id="ftBd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.52"/>
      <stop offset="33%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="66%" stop-color="#F59E0B" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="w1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="w2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#FB7185" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="ftClip"><rect x="0" y="6" width="1400" height="170" rx="20"/></clipPath>
    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      @keyframes waveDrift1 { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(-60px); } }
      @keyframes waveDrift2 { 0%, 100% { transform: translateX(-40px); } 50% { transform: translateX(40px); } }
      @keyframes crestSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ftSweep { 0%, 100% { transform: translateX(-1400px); } 35% { transform: translateX(1400px); } }
      .wv1 { animation: waveDrift1 9s ease-in-out infinite; }
      .wv2 { animation: waveDrift2 11s ease-in-out infinite; }
      .crestOrb { transform-box: fill-box; transform-origin: center; animation: crestSpin 18s linear infinite; }
      .ftSw { animation: ftSweep 8.5s ease-in-out infinite; }
    ]]></style>
  </defs>

  <g filter="url(#cardShadow)">
    <g clip-path="url(#ftClip)">
      <rect x="0" y="6" width="1400" height="170" rx="20" fill="url(#ftBg)"/>
      <!-- Layered multi-color aurora waves -->
      <path class="wv1" d="M-80,142 Q260,104 600,136 T1280,126 T1520,140 L1520,190 L-80,190 Z" fill="url(#w1)"/>
      <path class="wv2" d="M-80,152 Q320,174 720,138 T1360,150 T1520,142 L1520,190 L-80,190 Z" fill="url(#w2)"/>
      <rect class="ftSw" x="0" y="6" width="1400" height="170" fill="url(#sheenGrad)"/>
    </g>
    <rect x="0.75" y="6.75" width="1398.5" height="168.5" rx="19.5" fill="none" stroke="url(#ftBd)" stroke-width="1.5"/>

    <!-- Monogram crest -->
    <circle cx="700" cy="48" r="24" fill="none" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 6" class="crestOrb"/>
    <circle cx="700" cy="48" r="18" fill="#0B1018" stroke="url(#ftBd)" stroke-width="1.5"/>
    <text x="700" y="54" class="mono" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">NM</text>

    <text x="700" y="102" class="sans" font-size="24" font-weight="800" letter-spacing="0.6" fill="#FFFFFF" text-anchor="middle">Nitin Maharaj  &#8226;  Full Stack Developer</text>
    <text x="700" y="130" class="sans" font-size="15" font-weight="400" fill="#CBD5E1" text-anchor="middle">Building scalable, performant, and production-ready web &amp; mobile applications.</text>

    <!-- Bottom multi-color signature chips -->
    <circle cx="486" cy="154" r="3.5" fill="#FB7185"/>
    <text x="498" y="158" class="mono" font-size="11.5" font-weight="700" fill="#CBD5E1">Laravel &amp; PHP</text>
    <circle cx="614" cy="154" r="3.5" fill="#FBBF24"/>
    <text x="626" y="158" class="mono" font-size="11.5" font-weight="700" fill="#CBD5E1">MERN Stack</text>
    <circle cx="732" cy="154" r="3.5" fill="#38BDF8"/>
    <text x="744" y="158" class="mono" font-size="11.5" font-weight="700" fill="#CBD5E1">Flutter PWA</text>
    <circle cx="852" cy="154" r="3.5" fill="#10B981"/>
    <text x="864" y="158" class="mono" font-size="11.5" font-weight="700" fill="#34D399">Let's Collaborate</text>
  </g>
</svg>
