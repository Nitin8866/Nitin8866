<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380" role="img" aria-label="Featured Projects — Laravel Admin Panel, Nilkant Jewellers, Gym Platform PWA">
  <defs>
    
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    
    <linearGradient id="fpBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="62%" stop-color="#121621"/><stop offset="100%" stop-color="#211419"/>
    </linearGradient>
    <linearGradient id="fpBd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.55"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="fpClip1"><rect x="0" y="6" width="448" height="366" rx="18"/></clipPath>
    <linearGradient id="fpBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="62%" stop-color="#121621"/><stop offset="100%" stop-color="#0F201B"/>
    </linearGradient>
    <linearGradient id="fpBd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.55"/><stop offset="100%" stop-color="#14B8A6" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="fpClip2"><rect x="476" y="6" width="448" height="366" rx="18"/></clipPath>
    <linearGradient id="fpBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="62%" stop-color="#121621"/><stop offset="100%" stop-color="#101B29"/>
    </linearGradient>
    <linearGradient id="fpBd3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/><stop offset="100%" stop-color="#6366F1" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="fpClip3"><rect x="952" y="6" width="448" height="366" rx="18"/></clipPath>
    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes eqPulse { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.45); } }
      @keyframes gemSpin { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-3px) scale(1.08); } }
      @keyframes waveOut { 0% { opacity: 0.85; transform: scale(0.75); } 100% { opacity: 0; transform: scale(1.35); } }
      @keyframes sweep1 { 0%, 100% { transform: translateX(-500px); } 26% { transform: translateX(500px); } 28%, 99% { transform: translateX(500px); } }
      @keyframes sweep2 { 0%, 30% { transform: translateX(-500px); } 56% { transform: translateX(500px); } 58%, 100% { transform: translateX(500px); } }
      @keyframes sweep3 { 0%, 60% { transform: translateX(-500px); } 86% { transform: translateX(500px); } 88%, 100% { transform: translateX(500px); } }
      .pulseDot { animation: pulseDot 2s ease-in-out infinite; }
      .eq1 { transform-box: fill-box; transform-origin: bottom; animation: eqPulse 1.6s ease-in-out 0.0s infinite; }
      .eq2 { transform-box: fill-box; transform-origin: bottom; animation: eqPulse 1.6s ease-in-out 0.3s infinite; }
      .eq3 { transform-box: fill-box; transform-origin: bottom; animation: eqPulse 1.6s ease-in-out 0.6s infinite; }
      .eq4 { transform-box: fill-box; transform-origin: bottom; animation: eqPulse 1.6s ease-in-out 0.9s infinite; }
      .gemFloat { animation: gemSpin 3s ease-in-out infinite; }
      .pwaWave1 { transform-box: fill-box; transform-origin: center; animation: waveOut 2.2s ease-out infinite; }
      .pwaWave2 { transform-box: fill-box; transform-origin: center; animation: waveOut 2.2s ease-out 0.7s infinite; }
      .sw1 { animation: sweep1 8s ease-in-out infinite; }
      .sw2 { animation: sweep2 8s ease-in-out infinite; }
      .sw3 { animation: sweep3 8s ease-in-out infinite; }
    ]]></style>
  </defs>
  
