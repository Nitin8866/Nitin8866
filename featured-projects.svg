      <circle cx="510" cy="193" r="3.5" fill="#34D399"/>
      <text x="524" y="198" class="sans" font-size="14.5" font-weight="500" fill="#CBD5E1">Fast Laravel 8 catalog &amp; routing setup</text>
      <circle cx="510" cy="227" r="3.5" fill="#34D399"/>
