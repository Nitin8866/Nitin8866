      <text x="48" y="266" class="sans" font-size="14.5" font-weight="500" fill="#CBD5E1">Indexed SQL &amp; query performance tuning</text>
    
      <rect x="28" y="314" width="87" height="32" rx="4" fill="#131924" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
      <text x="71.5" y="334" class="mono" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">Laravel</text>
      <rect x="125" y="314" width="72" height="32" rx="4" fill="#131924" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
      <text x="161.0" y="334" class="mono" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">Blade</text>
      <rect x="207" y="314" width="72" height="32" rx="4" fill="#131924" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
      <text x="243.0" y="334" class="mono" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">MySQL</text>
      <rect x="289" y="314" width="105" height="32" rx="4" fill="#131924" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
      <text x="341.5" y="334" class="mono" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">Bootstrap</text>
  </g>
  <g filter="url(#cardShadow)">
