    <!-- Title & description -->
    <text x="28" y="108" class="sans" font-size="24" font-weight="800" fill="#FFFFFF">Laravel Admin Panel</text>
    <text x="28" y="138" class="sans" font-size="14.5" font-weight="400" fill="#94A3B8">Modular backend architecture built for scalable</text>
    <text x="28" y="159" class="sans" font-size="14.5" font-weight="400" fill="#94A3B8">administrative workflows and custom RBAC control.</text>

    
      <circle cx="34" cy="193" r="3.5" fill="#FB7185"/>
