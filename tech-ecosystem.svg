<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 305" width="1400" height="305" role="img" aria-label="Technology Ecosystem — Backend, Frontend &amp; Mobile, Database &amp; Tooling">
  <defs>
    <linearGradient id="tBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="60%" stop-color="#1A1215"/><stop offset="100%" stop-color="#261312"/>
    </linearGradient>
    <linearGradient id="tBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="60%" stop-color="#0F1824"/><stop offset="100%" stop-color="#0D2230"/>
    </linearGradient>
    <linearGradient id="tBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="60%" stop-color="#101B19"/><stop offset="100%" stop-color="#0E241E"/>
    </linearGradient>

    <linearGradient id="tb1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.52"/><stop offset="100%" stop-color="#EF4444" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="tb2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.52"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="tb3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.52"/><stop offset="100%" stop-color="#14B8A6" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="47%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="53%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="cardShadow" x="-8%" y="-10%" width="116%" height="126%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.56"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="tc1"><rect x="0" y="6" width="448" height="290" rx="18"/></clipPath>
    <clipPath id="tc2"><rect x="476" y="6" width="448" height="290" rx="18"/></clipPath>
    <clipPath id="tc3"><rect x="952" y="6" width="448" height="290" rx="18"/></clipPath>

    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }

      @keyframes cardUp {
        0%   { opacity: 0; transform: translateY(18px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pillPop {
        0%   { opacity: 0; transform: scale(0.90) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes sweepCard {
        0%, 100% { transform: translateX(-480px); opacity: 0; }
        10%      { opacity: 1; }
        42%      { transform: translateX(480px); opacity: 1; }
        48%      { opacity: 0; }
      }
      @keyframes pillGlow {
        0%, 100% { stroke-opacity: 0.45; }
        50%      { stroke-opacity: 0.95; }
      }

      .card1 { opacity: 0; animation: cardUp 0.50s cubic-bezier(0.22,1,0.36,1) 0.05s forwards; }
      .card2 { opacity: 0; animation: cardUp 0.50s cubic-bezier(0.22,1,0.36,1) 0.16s forwards; }
      .card3 { opacity: 0; animation: cardUp 0.50s cubic-bezier(0.22,1,0.36,1) 0.27s forwards; }

      .sw1 { animation: sweepCard 8s ease-in-out 0.4s infinite; }
      .sw2 { animation: sweepCard 8s ease-in-out 3.0s infinite; }
      .sw3 { animation: sweepCard 8s ease-in-out 5.6s infinite; }

      .p1 { opacity: 0; animation: pillPop 0.40s cubic-bezier(0.22,1,0.36,1) 0.25s forwards; }
      .p2 { opacity: 0; animation: pillPop 0.40s cubic-bezier(0.22,1,0.36,1) 0.33s forwards; }
      .p3 { opacity: 0; animation: pillPop 0.40s cubic-bezier(0.22,1,0.36,1) 0.41s forwards; }
      .p4 { opacity: 0; animation: pillPop 0.40s cubic-bezier(0.22,1,0.36,1) 0.49s forwards; }
      .p5 { opacity: 0; animation: pillPop 0.40s cubic-bezier(0.22,1,0.36,1) 0.57s forwards; }
      .p6 { opacity: 0; animation: pillPop 0.40s cubic-bezier(0.22,1,0.36,1) 0.65s forwards; }

      .pg { animation: pillGlow 3.2s ease-in-out infinite; }
    ]]></style>
  </defs>

  <!-- CARD 1: BACKEND & FRAMEWORKS (Warm Orange-Coral) -->
  <g class="card1" filter="url(#cardShadow)">
    <g clip-path="url(#tc1)">
      <rect x="0" y="6" width="448" height="290" rx="18" fill="url(#tBg1)"/>
      <rect class="sw1" x="0" y="6" width="448" height="290" fill="url(#sheen)"/>
    </g>
    <rect x="0.75" y="6.75" width="446.5" height="288.5" rx="17.5" fill="none" stroke="url(#tb1)" stroke-width="1.5"/>

    <circle cx="106" cy="48" r="14" fill="#F97316" fill-opacity="0.18" stroke="#FB923C" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M100 44 L112 44 M100 48 L112 48 M100 52 L112 52" stroke="#FB923C" stroke-width="2" stroke-linecap="round"/>
    <text x="132" y="54" class="sans" font-size="16" font-weight="800" letter-spacing="1.6" fill="#FB923C">BACKEND &amp; FRAMEWORKS</text>

    <!-- 2x2 Brand Pills -->
    <g class="p1">
      <rect class="pg" x="28" y="96" width="188" height="62" rx="12" fill="#181214" stroke="#FF2D20" stroke-width="1.4"/>
      <circle cx="54" cy="127" r="6" fill="#FF2D20" filter="url(#glow)"/>
      <text x="72" y="133" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">Laravel</text>
    </g>
    <g class="p2">
      <rect class="pg" x="232" y="96" width="188" height="62" rx="12" fill="#111A14" stroke="#339933" stroke-width="1.4"/>
      <circle cx="258" cy="127" r="6" fill="#4ADE80" filter="url(#glow)"/>
      <text x="276" y="133" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">Node.js</text>
    </g>
    <g class="p3">
      <rect class="pg" x="28" y="176" width="188" height="62" rx="12" fill="#12141A" stroke="#94A3B8" stroke-width="1.4"/>
      <circle cx="54" cy="207" r="6" fill="#E2E8F0" filter="url(#glow)"/>
      <text x="72" y="213" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">Express.js</text>
    </g>
    <g class="p4">
      <rect class="pg" x="232" y="176" width="188" height="62" rx="12" fill="#141522" stroke="#777BB4" stroke-width="1.4"/>
      <circle cx="258" cy="207" r="6" fill="#818CF8" filter="url(#glow)"/>
      <text x="276" y="213" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">PHP 8+</text>
    </g>
    <text x="224" y="270" class="mono" font-size="12.5" font-weight="600" fill="#94A3B8" text-anchor="middle">REST APIs • MVC • RBAC • Middleware</text>
  </g>

  <!-- CARD 2: FRONTEND & MOBILE (Electric Cyan-Blue) -->
  <g class="card2" filter="url(#cardShadow)">
    <g clip-path="url(#tc2)">
      <rect x="476" y="6" width="448" height="290" rx="18" fill="url(#tBg2)"/>
      <rect class="sw2" x="476" y="6" width="448" height="290" fill="url(#sheen)"/>
    </g>
    <rect x="476.75" y="6.75" width="446.5" height="288.5" rx="17.5" fill="none" stroke="url(#tb2)" stroke-width="1.5"/>

    <circle cx="590" cy="48" r="14" fill="#06B6D4" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M585 48 L589 44 M585 48 L589 52 M595 48 L591 44 M595 48 L591 52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="614" y="54" class="sans" font-size="16" font-weight="800" letter-spacing="1.6" fill="#38BDF8">FRONTEND &amp; MOBILE</text>

    <!-- 3x2 Pills -->
    <g class="p1">
      <rect class="pg" x="504" y="88" width="188" height="46" rx="11" fill="#0E1922" stroke="#61DAFB" stroke-width="1.3"/>
      <circle cx="526" cy="111" r="5" fill="#61DAFB" filter="url(#glow)"/>
      <text x="542" y="117" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">React</text>
    </g>
    <g class="p2">
      <rect class="pg" x="708" y="88" width="188" height="46" rx="11" fill="#0C1726" stroke="#0EA5E9" stroke-width="1.3"/>
      <circle cx="730" cy="111" r="5" fill="#38BDF8" filter="url(#glow)"/>
      <text x="746" y="117" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">Flutter</text>
    </g>
    <g class="p3">
      <rect class="pg" x="504" y="146" width="188" height="46" rx="11" fill="#1C1A0E" stroke="#FACC15" stroke-width="1.3"/>
      <circle cx="526" cy="169" r="5" fill="#FACC15" filter="url(#glow)"/>
      <text x="542" y="175" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">JavaScript</text>
    </g>
    <g class="p4">
      <rect class="pg" x="708" y="146" width="188" height="46" rx="11" fill="#0C1C22" stroke="#06B6D4" stroke-width="1.3"/>
      <circle cx="730" cy="169" r="5" fill="#22D3EE" filter="url(#glow)"/>
      <text x="746" y="175" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">TailwindCSS</text>
    </g>
    <g class="p5">
      <rect class="pg" x="504" y="204" width="188" height="46" rx="11" fill="#171324" stroke="#7952B3" stroke-width="1.3"/>
      <circle cx="526" cy="227" r="5" fill="#A78BFA" filter="url(#glow)"/>
      <text x="542" y="233" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">Bootstrap</text>
    </g>
    <g class="p6">
      <rect class="pg" x="708" y="204" width="188" height="46" rx="11" fill="#181226" stroke="#7F52FF" stroke-width="1.3"/>
      <circle cx="730" cy="227" r="5" fill="#C084FC" filter="url(#glow)"/>
      <text x="746" y="233" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">Kotlin</text>
    </g>
    <text x="700" y="274" class="mono" font-size="12.5" font-weight="600" fill="#94A3B8" text-anchor="middle">Responsive UI • PWAs • Cross-Platform</text>
  </g>

  <!-- CARD 3: DATABASE & TOOLING (Emerald-Teal) -->
  <g class="card3" filter="url(#cardShadow)">
    <g clip-path="url(#tc3)">
      <rect x="952" y="6" width="448" height="290" rx="18" fill="url(#tBg3)"/>
      <rect class="sw3" x="952" y="6" width="448" height="290" fill="url(#sheen)"/>
    </g>
    <rect x="952.75" y="6.75" width="446.5" height="288.5" rx="17.5" fill="none" stroke="url(#tb3)" stroke-width="1.5"/>

    <circle cx="1064" cy="48" r="14" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.5" stroke-width="1"/>
    <ellipse cx="1064" cy="44" rx="6" ry="2.5" fill="none" stroke="#34D399" stroke-width="1.6"/>
    <path d="M1058 44 V52 C1058 53.5 1070 53.5 1070 52 V44" fill="none" stroke="#34D399" stroke-width="1.6"/>
    <text x="1088" y="54" class="sans" font-size="16" font-weight="800" letter-spacing="1.6" fill="#34D399">DATABASE &amp; TOOLING</text>

    <g class="p1">
      <rect class="pg" x="980" y="96" width="188" height="62" rx="12" fill="#0F1E14" stroke="#4EA94B" stroke-width="1.4"/>
      <circle cx="1006" cy="127" r="6" fill="#4ADE80" filter="url(#glow)"/>
      <text x="1024" y="133" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">MongoDB</text>
    </g>
    <g class="p2">
      <rect class="pg" x="1184" y="96" width="188" height="62" rx="12" fill="#101A24" stroke="#4479A1" stroke-width="1.4"/>
      <circle cx="1210" cy="127" r="6" fill="#60A5FA" filter="url(#glow)"/>
      <text x="1228" y="133" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">MySQL</text>
    </g>
    <g class="p3">
      <rect class="pg" x="980" y="176" width="188" height="62" rx="12" fill="#1F1310" stroke="#F05032" stroke-width="1.4"/>
      <circle cx="1006" cy="207" r="6" fill="#FB923C" filter="url(#glow)"/>
      <text x="1024" y="213" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">Git</text>
    </g>
    <g class="p4">
      <rect class="pg" x="1184" y="176" width="188" height="62" rx="12" fill="#1E1216" stroke="#F24E1E" stroke-width="1.4"/>
      <circle cx="1210" cy="207" r="6" fill="#FB7185" filter="url(#glow)"/>
      <text x="1228" y="213" class="sans" font-size="18.5" font-weight="700" fill="#FFFFFF">Figma</text>
    </g>
    <text x="1176" y="270" class="mono" font-size="12.5" font-weight="600" fill="#94A3B8" text-anchor="middle">Query Tuning • Git Workflows • UI/UX</text>
  </g>
</svg>
