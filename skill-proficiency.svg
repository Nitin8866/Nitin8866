<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 410" width="1400" height="410" role="img" aria-label="Skill Proficiency Matrix">
  <defs>
    <linearGradient id="spBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="65%" stop-color="#141620"/><stop offset="100%" stop-color="#1D1712"/>
    </linearGradient>
    <linearGradient id="spBgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="65%" stop-color="#111824"/><stop offset="100%" stop-color="#0E2028"/>
    </linearGradient>
    <linearGradient id="spBorderL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.44"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="spBorderR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.44"/><stop offset="100%" stop-color="#10B981" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="barScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lg0" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#FBBF24"/></linearGradient>
    <linearGradient id="lg3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#EA580C"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
    <linearGradient id="lg4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="lg5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#EAB308"/><stop offset="100%" stop-color="#FDE047"/></linearGradient>
    <linearGradient id="rg0" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F97316"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
    <linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0284C7"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="rg2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#DC2626"/><stop offset="100%" stop-color="#F87171"/></linearGradient>
    <linearGradient id="rg3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#67E8F9"/></linearGradient>
    <linearGradient id="rg4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="rg5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#34D399"/></linearGradient>

    <filter id="cardShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.56"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="spL"><rect x="0" y="6" width="688" height="396" rx="18"/></clipPath>
    <clipPath id="spR"><rect x="712" y="6" width="688" height="396" rx="18"/></clipPath>

    <clipPath id="lBarsClip">
      <rect x="206" y="102" width="344" height="10" rx="5"/>
      <rect x="206" y="150" width="258" height="10" rx="5"/>
      <rect x="206" y="198" width="344" height="10" rx="5"/>
      <rect x="206" y="246" width="344" height="10" rx="5"/>
      <rect x="206" y="294" width="258" height="10" rx="5"/>
      <rect x="206" y="342" width="172" height="10" rx="5"/>
    </clipPath>
    <clipPath id="rBarsClip">
      <rect x="918" y="102" width="344" height="10" rx="5"/>
      <rect x="918" y="150" width="301" height="10" rx="5"/>
      <rect x="918" y="198" width="344" height="10" rx="5"/>
      <rect x="918" y="246" width="344" height="10" rx="5"/>
      <rect x="918" y="294" width="344" height="10" rx="5"/>
      <rect x="918" y="342" width="301" height="10" rx="5"/>
    </clipPath>

    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }

      @keyframes cardIn { 0% { opacity: 0; transform: translateY(16px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes rowIn  { 0% { opacity: 0; transform: translateX(-12px); } 100% { opacity: 1; transform: translateX(0); } }
      @keyframes sweepL { 0% { transform: translateX(-100px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(480px); opacity: 0; } }
      @keyframes sweepR { 0% { transform: translateX(-100px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(480px); opacity: 0; } }

      .pcL { opacity: 0; animation: cardIn 0.50s cubic-bezier(0.22,1,0.36,1) 0.05s forwards; }
      .pcR { opacity: 0; animation: cardIn 0.50s cubic-bezier(0.22,1,0.36,1) 0.16s forwards; }

      .sr0 { opacity: 0; animation: rowIn 0.42s ease-out 0.18s forwards; }
      .sr1 { opacity: 0; animation: rowIn 0.42s ease-out 0.26s forwards; }
      .sr2 { opacity: 0; animation: rowIn 0.42s ease-out 0.34s forwards; }
      .sr3 { opacity: 0; animation: rowIn 0.42s ease-out 0.42s forwards; }
      .sr4 { opacity: 0; animation: rowIn 0.42s ease-out 0.50s forwards; }
      .sr5 { opacity: 0; animation: rowIn 0.42s ease-out 0.58s forwards; }

            @keyframes kf_l0 { 0% { width: 0px; } 100% { width: 344px; } }
      .lb0 { width: 0px; animation: kf_l0 0.9s cubic-bezier(0.22,1,0.36,1) 0.25s forwards; }
      @keyframes kf_l1 { 0% { width: 0px; } 100% { width: 258px; } }
      .lb1 { width: 0px; animation: kf_l1 0.9s cubic-bezier(0.22,1,0.36,1) 0.33s forwards; }
      @keyframes kf_l2 { 0% { width: 0px; } 100% { width: 344px; } }
      .lb2 { width: 0px; animation: kf_l2 0.9s cubic-bezier(0.22,1,0.36,1) 0.41s forwards; }
      @keyframes kf_l3 { 0% { width: 0px; } 100% { width: 344px; } }
      .lb3 { width: 0px; animation: kf_l3 0.9s cubic-bezier(0.22,1,0.36,1) 0.49s forwards; }
      @keyframes kf_l4 { 0% { width: 0px; } 100% { width: 258px; } }
      .lb4 { width: 0px; animation: kf_l4 0.9s cubic-bezier(0.22,1,0.36,1) 0.57s forwards; }
      @keyframes kf_l5 { 0% { width: 0px; } 100% { width: 172px; } }
      .lb5 { width: 0px; animation: kf_l5 0.9s cubic-bezier(0.22,1,0.36,1) 0.65s forwards; }
      @keyframes kf_r0 { 0% { width: 0px; } 100% { width: 344px; } }
      .rb0 { width: 0px; animation: kf_r0 0.9s cubic-bezier(0.22,1,0.36,1) 0.25s forwards; }
      @keyframes kf_r1 { 0% { width: 0px; } 100% { width: 301px; } }
      .rb1 { width: 0px; animation: kf_r1 0.9s cubic-bezier(0.22,1,0.36,1) 0.33s forwards; }
      @keyframes kf_r2 { 0% { width: 0px; } 100% { width: 344px; } }
      .rb2 { width: 0px; animation: kf_r2 0.9s cubic-bezier(0.22,1,0.36,1) 0.41s forwards; }
      @keyframes kf_r3 { 0% { width: 0px; } 100% { width: 344px; } }
      .rb3 { width: 0px; animation: kf_r3 0.9s cubic-bezier(0.22,1,0.36,1) 0.49s forwards; }
      @keyframes kf_r4 { 0% { width: 0px; } 100% { width: 344px; } }
      .rb4 { width: 0px; animation: kf_r4 0.9s cubic-bezier(0.22,1,0.36,1) 0.57s forwards; }
      @keyframes kf_r5 { 0% { width: 0px; } 100% { width: 301px; } }
      .rb5 { width: 0px; animation: kf_r5 0.9s cubic-bezier(0.22,1,0.36,1) 0.65s forwards; }

      .scanL { animation: sweepL 3.8s ease-in-out 1.4s infinite; }
      .scanR { animation: sweepR 3.8s ease-in-out 2.8s infinite; }
    ]]></style>
  </defs>

  <!-- LEFT PANEL: PROGRAMMING & CORE -->
  <g class="pcL" filter="url(#cardShadow)">
    <g clip-path="url(#spL)">
