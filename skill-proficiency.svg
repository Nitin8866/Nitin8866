      <text x="1394" y="208" class="mono" font-size="14.5" font-weight="700" fill="#F87171" text-anchor="end">80%</text>
    </g>

    <g class="sr3">
      <circle cx="756" cy="251" r="4.5" fill="#67E8F9"/>
      <text x="770" y="256" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">React</text>
      <rect x="918" y="246" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="rb3" x="918" y="246" width="344" height="10" rx="5" fill="url(#rg3)"/>
      <text x="1394" y="256" class="mono" font-size="14.5" font-weight="700" fill="#67E8F9" text-anchor="end">80%</text>
    </g>

    <g class="sr4">
      <circle cx="756" cy="299" r="4.5" fill="#38BDF8"/>
      <text x="770" y="304" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">Flutter</text>
      <rect x="918" y="294" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="rb4" x="918" y="294" width="344" height="10" rx="5" fill="url(#rg4)"/>
      <text x="1394" y="304" class="mono" font-size="14.5" font-weight="700" fill="#38BDF8" text-anchor="end">80%</text>
    </g>

    <g class="sr5">
      <circle cx="756" cy="347" r="4.5" fill="#34D399"/>
      <text x="770" y="352" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">Kotlin</text>
      <rect x="918" y="342" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="rb5" x="918" y="342" width="301" height="10" rx="5" fill="url(#rg5)"/>
      <text x="1394" y="352" class="mono" font-size="14.5" font-weight="700" fill="#34D399" text-anchor="end">70%</text>
    </g>
    <g clip-path="url(#rBarsClip)">
      <rect class="scanR" x="918" y="98" width="90" height="270" fill="url(#barScanGrad)"/>
