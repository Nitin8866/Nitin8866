    </g>
    <rect x="0.75" y="6.75" width="686.5" height="394.5" rx="17.5" fill="none" stroke="url(#spBorderL)" stroke-width="1.5"/>

    <circle cx="44" cy="48" r="5.5" fill="#F59E0B"/>
    <text x="60" y="55" class="sans" font-size="18" font-weight="800" letter-spacing="1.4" fill="#FDE68A">PROGRAMMING &amp; CORE</text>
    <text x="652" y="54" class="mono" font-size="12.5" font-weight="700" fill="#94A3B8" text-anchor="end">6 LANGUAGES</text>
    
    <g class="sr0">
      <circle cx="44" cy="107" r="4.5" fill="#60A5FA"/>
      <text x="58" y="112" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">C Language</text>
      <rect x="206" y="102" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="lb0" x="206" y="102" width="344" height="10" rx="5" fill="url(#lg0)"/>
      <text x="682" y="112" class="mono" font-size="14.5" font-weight="700" fill="#60A5FA" text-anchor="end">80%</text>
    </g>

    <g class="sr1">
      <circle cx="44" cy="155" r="4.5" fill="#818CF8"/>
      <text x="58" y="160" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">C++</text>
      <rect x="206" y="150" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="lb1" x="206" y="150" width="258" height="10" rx="5" fill="url(#lg1)"/>
      <text x="682" y="160" class="mono" font-size="14.5" font-weight="700" fill="#818CF8" text-anchor="end">60%</text>
    </g>

    <g class="sr2">
      <circle cx="44" cy="203" r="4.5" fill="#FBBF24"/>
      <text x="58" y="208" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">Python</text>
      <rect x="206" y="198" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="lb2" x="206" y="198" width="344" height="10" rx="5" fill="url(#lg2)"/>
      <text x="682" y="208" class="mono" font-size="14.5" font-weight="700" fill="#FBBF24" text-anchor="end">80%</text>
    </g>

    <g class="sr3">
      <circle cx="44" cy="251" r="4.5" fill="#FB923C"/>
      <text x="58" y="256" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">Java</text>
      <rect x="206" y="246" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="lb3" x="206" y="246" width="344" height="10" rx="5" fill="url(#lg3)"/>
      <text x="682" y="256" class="mono" font-size="14.5" font-weight="700" fill="#FB923C" text-anchor="end">80%</text>
    </g>

    <g class="sr4">
      <circle cx="44" cy="299" r="4.5" fill="#A78BFA"/>
      <text x="58" y="304" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">PHP</text>
      <rect x="206" y="294" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="lb4" x="206" y="294" width="258" height="10" rx="5" fill="url(#lg4)"/>
      <text x="682" y="304" class="mono" font-size="14.5" font-weight="700" fill="#A78BFA" text-anchor="end">60%</text>
    </g>

    <g class="sr5">
      <circle cx="44" cy="347" r="4.5" fill="#FDE047"/>
      <text x="58" y="352" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">JavaScript</text>
      <rect x="206" y="342" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="lb5" x="206" y="342" width="172" height="10" rx="5" fill="url(#lg5)"/>
      <text x="682" y="352" class="mono" font-size="14.5" font-weight="700" fill="#FDE047" text-anchor="end">40%</text>
    </g>
    <g clip-path="url(#lBarsClip)">
      <rect class="scanL" x="206" y="98" width="90" height="270" fill="url(#barScanGrad)"/>
    </g>
  </g>

  <!-- RIGHT PANEL: FRAMEWORKS & WEB/MOBILE -->
  <g class="pcR" filter="url(#cardShadow)">
    <g clip-path="url(#spR)">
      <rect x="712" y="6" width="688" height="396" rx="18" fill="url(#spBgR)"/>
    </g>
    <rect x="712.75" y="6.75" width="686.5" height="394.5" rx="17.5" fill="none" stroke="url(#spBorderR)" stroke-width="1.5"/>

    <circle cx="756" cy="48" r="5.5" fill="#22D3EE"/>
    <text x="772" y="55" class="sans" font-size="18" font-weight="800" letter-spacing="1.4" fill="#A5F3FC">FRAMEWORKS &amp; WEB / MOBILE</text>
    <text x="1364" y="54" class="mono" font-size="12.5" font-weight="700" fill="#94A3B8" text-anchor="end">6 STACKS</text>
    
    <g class="sr0">
      <circle cx="756" cy="107" r="4.5" fill="#FB923C"/>
      <text x="770" y="112" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">HTML5</text>
      <rect x="918" y="102" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="rb0" x="918" y="102" width="344" height="10" rx="5" fill="url(#rg0)"/>
      <text x="1394" y="112" class="mono" font-size="14.5" font-weight="700" fill="#FB923C" text-anchor="end">80%</text>
    </g>

    <g class="sr1">
      <circle cx="756" cy="155" r="4.5" fill="#38BDF8"/>
      <text x="770" y="160" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">CSS3</text>
      <rect x="918" y="150" width="430" height="10" rx="5" fill="#1E293B"/>
      <rect class="rb1" x="918" y="150" width="301" height="10" rx="5" fill="url(#rg1)"/>
      <text x="1394" y="160" class="mono" font-size="14.5" font-weight="700" fill="#38BDF8" text-anchor="end">70%</text>
    </g>

    <g class="sr2">
      <circle cx="756" cy="203" r="4.5" fill="#F87171"/>
      <text x="770" y="208" class="sans" font-size="16" font-weight="700" fill="#F1F5F9">Laravel</text>
      <rect x="918" y="198" width="430" height="10" rx="5" fill="#1E293B"/>
