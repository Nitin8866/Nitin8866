<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 96" width="1400" height="96" role="img" aria-label="System Announcement — Open for engineering &amp; consulting">
  <defs>
    
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="annBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="52%" stop-color="#111824"/>
      <stop offset="100%" stop-color="#181922"/>
    </linearGradient>
    <linearGradient id="annBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.58"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <clipPath id="annClip"><rect x="2" y="6" width="1396" height="82" rx="18"/></clipPath>
    <clipPath id="ctaClip"><rect x="1152" y="24" width="218" height="46" rx="12"/></clipPath>
    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      @keyframes radarRing {
        0%   { r: 5px; opacity: 0.9; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes annSweep {
        0%   { transform: translateX(-1400px); }
        32%  { transform: translateX(1400px); }
        100% { transform: translateX(1400px); }
      }
      @keyframes ctaShine {
        0%, 60% { transform: translateX(-240px); }
        82%     { transform: translateX(260px); }
        100%    { transform: translateX(260px); }
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.45; }
      }
      .ringAnim { animation: radarRing 2.2s ease-out infinite; }
      .dotAnim  { animation: dotBlink 1.8s ease-in-out infinite; }
      .swAnn    { animation: annSweep 7.5s ease-in-out infinite; }
      .swCta    { animation: ctaShine 5s ease-in-out infinite; }
    ]]></style>
  </defs>

  <g filter="url(#cardShadow)">
    <g clip-path="url(#annClip)">
      <rect x="2" y="6" width="1396" height="82" rx="18" fill="url(#annBg)"/>
      <circle cx="95" cy="47" r="95" fill="#10B981" fill-opacity="0.07"/>
      <circle cx="1290" cy="47" r="140" fill="#F59E0B" fill-opacity="0.06"/>
      <rect class="swAnn" x="2" y="6" width="1396" height="82" fill="url(#sheenGrad)"/>
    </g>
    <rect x="2.75" y="6.75" width="1394.5" height="80.5" rx="17.5" fill="none" stroke="url(#annBorder)" stroke-width="1.5"/>

    <!-- Live radar indicator -->
    <circle cx="42" cy="47" r="5" fill="#10B981" opacity="0.85" class="ringAnim"/>
    <circle cx="42" cy="47" r="5" fill="#34D399" filter="url(#glow)" class="dotAnim"/>

    <!-- Announcement pill & copy -->
    <rect x="64" y="21" width="194" height="22" rx="6" fill="#0B221B" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
    <text x="161" y="36" class="mono" font-size="11.5" font-weight="800" letter-spacing="1.4" fill="#34D399" text-anchor="middle">SYSTEM ANNOUNCEMENT</text>

    <rect x="268" y="21" width="112" height="22" rx="6" fill="#0F1D2B" stroke="#38BDF8" stroke-opacity="0.42" stroke-width="1"/>
    <text x="324" y="36" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#38BDF8" text-anchor="middle">OPEN TO WORK</text>

    <text x="64" y="67" class="sans" font-size="17" font-weight="600" fill="#E6EDF3">Full-Stack Engineer open for hiring, technical consulting &amp; enterprise software development.</text>

    <!-- Right CTA button -->
    <g clip-path="url(#ctaClip)">
      <rect x="1152" y="24" width="218" height="46" rx="12" fill="url(#ctaGrad)"/>
      <rect class="swCta" x="1152" y="24" width="80" height="46" fill="url(#barSheen)"/>
    </g>
    <text x="1261" y="53" class="sans" font-size="14.5" font-weight="800" letter-spacing="1.2" fill="#0D1117" text-anchor="middle">GET IN TOUCH &#8594;</text>
  </g>
</svg>
