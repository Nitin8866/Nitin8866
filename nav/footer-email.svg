  <rect x="26" y="22" width="22" height="16" rx="2.5" fill="none" stroke="#FB7185" stroke-width="2"/><path d="M27 23 L37 31 L47 23" fill="none" stroke="#FB7185" stroke-width="2" stroke-linecap="round"/>
