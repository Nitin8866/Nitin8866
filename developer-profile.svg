<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470" role="img" aria-label="Developer Profile &amp; Engineering Matrix — Nitin Maharaj">
  <defs>
    <linearGradient id="panelBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="55%" stop-color="#111724"/><stop offset="100%" stop-color="#101C26"/>
    </linearGradient>
    <linearGradient id="panelBgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="55%" stop-color="#131624"/><stop offset="100%" stop-color="#161426"/>
    </linearGradient>

    <radialGradient id="matrixGlow" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="profileOrb" cx="92%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panelBorderL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="panelBorderR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.38"/>
    </linearGradient>

    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dotPattern" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#94A3B8" fill-opacity="0.13"/>
    </pattern>

    <filter id="panelShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <filter id="glowBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="leftClip"><rect x="0" y="6" width="886" height="456" rx="20"/></clipPath>
    <clipPath id="rightClip"><rect x="910" y="6" width="490" height="456" rx="20"/></clipPath>
    <clipPath id="barsClip">
      <rect x="944" y="328" width="413" height="8" rx="4"/>
      <rect x="944" y="374" width="401" height="8" rx="4"/>
      <rect x="944" y="420" width="422" height="8" rx="4"/>
    </clipPath>

    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }

      @keyframes slideLeftIn {
        0%   { opacity: 0; transform: translateX(-18px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes slideUpIn {
        0%   { opacity: 0; transform: translateY(16px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes spinCW {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        0%   { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes corePulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50%      { transform: scale(1.06); opacity: 1; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.4; transform: scale(1.35); }
      }
      @keyframes fillBar1 { 0% { width: 0px; } 100% { width: 413px; } }
      @keyframes fillBar2 { 0% { width: 0px; } 100% { width: 401px; } }
      @keyframes fillBar3 { 0% { width: 0px; } 100% { width: 422px; } }
      @keyframes barScan {
        0%   { transform: translateX(-120px); opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateX(440px); opacity: 0; }
      }
      @keyframes nodeFloat {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-4px); }
      }

      .left-panel  { opacity: 0; animation: slideUpIn 0.55s cubic-bezier(0.22,1,0.36,1) 0.05s forwards; }
      .right-panel { opacity: 0; animation: slideUpIn 0.55s cubic-bezier(0.22,1,0.36,1) 0.16s forwards; }

      .r1 { opacity: 0; animation: slideLeftIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.20s forwards; }
      .r2 { opacity: 0; animation: slideLeftIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.30s forwards; }
      .r3 { opacity: 0; animation: slideLeftIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.40s forwards; }
      .r4 { opacity: 0; animation: slideLeftIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.50s forwards; }
      .r5 { opacity: 0; animation: slideLeftIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.60s forwards; }

      .orbit-cw  { transform-origin: 1155px 180px; animation: spinCW 24s linear infinite; }
      .orbit-ccw { transform-origin: 1155px 180px; animation: spinCCW 17s linear infinite; }
      .core-box  { transform-origin: 1155px 180px; animation: corePulse 3.2s ease-in-out infinite; }
      .dot-live  { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.2s ease-in-out infinite; }

      .b1 { width: 0px; animation: fillBar1 1.0s cubic-bezier(0.22,1,0.36,1) 0.35s forwards; }
      .b2 { width: 0px; animation: fillBar2 1.0s cubic-bezier(0.22,1,0.36,1) 0.50s forwards; }
      .b3 { width: 0px; animation: fillBar3 1.0s cubic-bezier(0.22,1,0.36,1) 0.65s forwards; }
      .scan { animation: barScan 3.4s ease-in-out 1.4s infinite; }

      .nf1 { animation: nodeFloat 3.4s ease-in-out 0.0s infinite; }
      .nf2 { animation: nodeFloat 3.4s ease-in-out 0.8s infinite; }
      .nf3 { animation: nodeFloat 3.4s ease-in-out 1.6s infinite; }
      .nf4 { animation: nodeFloat 3.4s ease-in-out 2.4s infinite; }
    ]]></style>
  </defs>

  <!-- LEFT CARD: DEVELOPER PROFILE -->
  <g class="left-panel" filter="url(#panelShadow)">
    <g clip-path="url(#leftClip)">
      <rect x="0" y="6" width="886" height="456" rx="20" fill="url(#panelBgL)"/>
      <rect x="0" y="6" width="886" height="456" fill="url(#profileOrb)"/>
    </g>
    <rect x="0.75" y="6.75" width="884.5" height="454.5" rx="19.5" fill="none" stroke="url(#panelBorderL)" stroke-width="1.5"/>

    <circle cx="42" cy="51" r="6" fill="#38BDF8"/>
    <text x="58" y="58" class="sans" font-size="22" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">DEVELOPER PROFILE</text>

    <rect x="692" y="36" width="160" height="30" rx="4" fill="#131926" stroke="#22C55E" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle class="dot-live" cx="711" cy="51" r="4.5" fill="#22C55E"/>
    <text x="724" y="56" class="mono" font-size="12.5" font-weight="700" fill="#BBF7D0">OPEN TO WORK</text>

    <text x="34" y="102" class="sans" font-size="16.5" font-weight="500" fill="#CBD5E1">
      Full Stack Engineer dedicated to designing high-throughput web applications, modular admin
    </text>
    <text x="34" y="126" class="sans" font-size="16.5" font-weight="500" fill="#CBD5E1">
      systems, and multi-platform mobile solutions backed by strong computer science fundamentals.
    </text>

    <g class="r1">
      <rect x="34" y="162" width="818" height="46" rx="6" fill="#090D14" fill-opacity="0.58" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="54" cy="185" r="4.5" fill="#FBBF24"/>
      <text x="70" y="190" class="sans" font-size="15.5" font-weight="700" fill="#FDE68A">Academic Degree:</text>
      <text x="218" y="190" class="sans" font-size="15" font-weight="500" fill="#E2E8F0">B.S. in Information Technology — DRS. Kiran &amp; Pallavi Patel Global Univ.</text>
    </g>

    <g class="r2">
      <rect x="34" y="218" width="818" height="46" rx="6" fill="#090D14" fill-opacity="0.58" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="54" cy="241" r="4.5" fill="#38BDF8"/>
      <text x="70" y="246" class="sans" font-size="15.5" font-weight="700" fill="#BAE6FD">Core Specialization:</text>
      <text x="234" y="246" class="sans" font-size="15" font-weight="500" fill="#E2E8F0">End-to-end Laravel, MERN Stack (MongoDB, Express, React, Node.js) &amp; Flutter</text>
    </g>

    <g class="r3">
      <rect x="34" y="274" width="818" height="46" rx="6" fill="#090D14" fill-opacity="0.58" stroke="#FB7185" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="54" cy="297" r="4.5" fill="#FB7185"/>
      <text x="70" y="302" class="sans" font-size="15.5" font-weight="700" fill="#FECDD3">Current Focus:</text>
      <text x="198" y="302" class="sans" font-size="15" font-weight="500" fill="#E2E8F0">Scalable Laravel backends, shared Blade component trees &amp; React UI patterns</text>
    </g>

    <g class="r4">
      <rect x="34" y="330" width="818" height="46" rx="6" fill="#090D14" fill-opacity="0.58" stroke="#34D399" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="54" cy="353" r="4.5" fill="#34D399"/>
      <text x="70" y="358" class="sans" font-size="15.5" font-weight="700" fill="#A7F3D0">Dev Philosophy:</text>
      <text x="206" y="358" class="sans" font-size="15" font-weight="500" fill="#E2E8F0">Clean code structure, modular architecture, pixel-perfect UI &amp; fast performance</text>
    </g>

    <g class="r5">
      <rect x="34" y="388" width="818" height="48" rx="6" fill="#0F232C" fill-opacity="0.72" stroke="#38BDF8" stroke-opacity="0.42" stroke-width="1.2"/>
      <circle cx="54" cy="412" r="4.5" fill="#22C55E"/>
      <text x="70" y="417" class="sans" font-size="15.5" font-weight="700" fill="#FFFFFF">Direct Contact:</text>
      <text x="196" y="417" class="mono" font-size="15" font-weight="600" fill="#BAE6FD">nitinmaharaj8866@gmail.com</text>
      <text x="836" y="417" class="sans" font-size="13.5" font-weight="700" fill="#38BDF8" text-anchor="end">CLICK TO EMAIL →</text>
    </g>
  </g>

  <!-- RIGHT CARD: ENGINEERING MATRIX -->
  <g class="right-panel" filter="url(#panelShadow)">
    <g clip-path="url(#rightClip)">
      <rect x="910" y="6" width="490" height="456" rx="20" fill="url(#panelBgR)"/>
      <rect x="910" y="6" width="490" height="456" fill="url(#dotPattern)"/>
      <rect x="910" y="6" width="490" height="456" fill="url(#matrixGlow)"/>
    </g>
    <rect x="910.75" y="6.75" width="488.5" height="454.5" rx="19.5" fill="none" stroke="url(#panelBorderR)" stroke-width="1.5"/>

    <text x="1155" y="48" class="sans" font-size="15" font-weight="800" letter-spacing="2.8" fill="#FBBF24" text-anchor="middle">ENGINEERING MATRIX</text>

    <circle cx="1155" cy="180" r="108" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.2"/>
    <g class="orbit-cw">
      <circle cx="1155" cy="180" r="96" fill="none" stroke="#38BDF8" stroke-opacity="0.48" stroke-width="1.6" stroke-dasharray="12 10"/>
      <circle cx="1155" cy="84" r="4.5" fill="#F43F5E"/>
      <circle cx="1155" cy="276" r="4.5" fill="#38BDF8"/>
    </g>
    <g class="orbit-ccw">
      <circle cx="1155" cy="180" r="68" fill="none" stroke="#F59E0B" stroke-opacity="0.48" stroke-width="1.4" stroke-dasharray="6 8"/>
      <circle cx="1087" cy="180" r="4" fill="#10B981"/>
      <circle cx="1223" cy="180" r="4" fill="#FACC15"/>
    </g>

    <g class="core-box" filter="url(#panelShadow)">
      <rect x="1117" y="142" width="76" height="76" rx="18" fill="#F7DF1E"/>
      <rect x="1117" y="142" width="76" height="76" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>
      <text x="1162" y="202" class="sans" font-size="38" font-weight="900" fill="#111827" text-anchor="middle">JS</text>
    </g>

    <g class="nf1">
      <rect x="938" y="88" width="112" height="30" rx="8" fill="#131926" fill-opacity="0.92" stroke="#FF4D4D" stroke-opacity="0.58" stroke-width="1.2"/>
      <circle cx="953" cy="103" r="3.5" fill="#FF4D4D"/>
      <text x="965" y="108" class="mono" font-size="13" font-weight="700" fill="#F8FAFC">Laravel</text>
    </g>
    <g class="nf2">
      <rect x="1260" y="88" width="112" height="30" rx="8" fill="#131926" fill-opacity="0.92" stroke="#61DAFB" stroke-opacity="0.58" stroke-width="1.2"/>
      <circle cx="1275" cy="103" r="3.5" fill="#61DAFB"/>
      <text x="1287" y="108" class="mono" font-size="13" font-weight="700" fill="#F8FAFC">React.js</text>
    </g>
    <g class="nf3">
      <rect x="938" y="242" width="112" height="30" rx="8" fill="#131926" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.58" stroke-width="1.2"/>
      <circle cx="953" cy="257" r="3.5" fill="#38BDF8"/>
      <text x="965" y="262" class="mono" font-size="13" font-weight="700" fill="#F8FAFC">Flutter</text>
    </g>
    <g class="nf4">
      <rect x="1260" y="242" width="112" height="30" rx="8" fill="#131926" fill-opacity="0.92" stroke="#4ADE80" stroke-opacity="0.58" stroke-width="1.2"/>
      <circle cx="1275" cy="257" r="3.5" fill="#4ADE80"/>
      <text x="1287" y="262" class="mono" font-size="13" font-weight="700" fill="#F8FAFC">Node.js</text>
    </g>

    <text x="944" y="320" class="sans" font-size="13.5" font-weight="700" fill="#E2E8F0">Clean Code Architecture</text>
    <text x="1366" y="320" class="mono" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="end">98%</text>
    <rect x="944" y="328" width="422" height="8" rx="4" fill="#1E293B"/>
    <rect class="b1" x="944" y="328" width="413" height="8" rx="4" fill="url(#bar1Grad)"/>

    <text x="944" y="366" class="sans" font-size="13.5" font-weight="700" fill="#E2E8F0">Microservices &amp; REST APIs</text>
    <text x="1366" y="366" class="mono" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="end">95%</text>
    <rect x="944" y="374" width="422" height="8" rx="4" fill="#1E293B"/>
    <rect class="b2" x="944" y="374" width="401" height="8" rx="4" fill="url(#bar2Grad)"/>

    <text x="944" y="412" class="sans" font-size="13.5" font-weight="700" fill="#E2E8F0">Responsive UI &amp; PWAs</text>
    <text x="1366" y="412" class="mono" font-size="13" font-weight="700" fill="#34D399" text-anchor="end">100%</text>
    <rect x="944" y="420" width="422" height="8" rx="4" fill="#1E293B"/>
    <rect class="b3" x="944" y="420" width="422" height="8" rx="4" fill="url(#bar3Grad)"/>

    <g clip-path="url(#barsClip)">
      <rect class="scan" x="944" y="326" width="90" height="106" fill="url(#scanSweep)"/>
    </g>
  </g>
</svg>
