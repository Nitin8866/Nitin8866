      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      @keyframes flowPkt { 0% { transform: translateX(0px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(42px); opacity: 0; } }
      @keyframes swArch { 0%, 100% { transform: translateX(-340px); } 30% { transform: translateX(340px); } }
      .pkt0 { animation: flowPkt 2.2s ease-in-out 0.0s infinite; }
      .pkt1 { animation: flowPkt 2.5s ease-in-out 0.7s infinite; }
      .pkt2 { animation: flowPkt 2.8s ease-in-out 1.4s infinite; }
      .asw0 { animation: swArch 8s ease-in-out 0.0s infinite; }
      .asw1 { animation: swArch 8s ease-in-out 1.5s infinite; }
      .asw2 { animation: swArch 8s ease-in-out 3.0s infinite; }
      .asw3 { animation: swArch 8s ease-in-out 4.5s infinite; }
    ]]></style>
