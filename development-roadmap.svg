<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 284" width="1400" height="284" role="img" aria-label="Development Roadmap — Shared Blade Partials, Gym Platform PWA, Advanced React &amp; Laravel">
  <defs>
    
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="126%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="rmc0"><rect x="0" y="94" width="448" height="178" rx="18"/></clipPath><clipPath id="rmBar0"><rect x="32" y="238" width="384" height="8" rx="4"/></clipPath><clipPath id="rmc1"><rect x="476" y="94" width="448" height="178" rx="18"/></clipPath><clipPath id="rmBar1"><rect x="508" y="238" width="261" height="8" rx="4"/></clipPath><clipPath id="rmc2"><rect x="952" y="94" width="448" height="178" rx="18"/></clipPath><clipPath id="rmBar2"><rect x="984" y="238" width="96" height="8" rx="4"/></clipPath>
    <style><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      @keyframes rmBeat { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.45; } }
      @keyframes rSweep { 0%, 100% { transform: translateX(-480px); } 30% { transform: translateX(480px); } }
      @keyframes rmBarMove { 0% { transform: translateX(0px); } 100% { transform: translateX(460px); } }
      .rmPulse { transform-box: fill-box; transform-origin: center; animation: rmBeat 1.8s ease-in-out infinite; }
      .rsw0 { animation: rSweep 8s ease-in-out 0.0s infinite; }
      .rsw1 { animation: rSweep 8s ease-in-out 2.0s infinite; }
      .rsw2 { animation: rSweep 8s ease-in-out 4.0s infinite; }
      .barGlint0 { animation: rmBarMove 3.8s ease-in-out 0.0s infinite; }
      .barGlint1 { animation: rmBarMove 3.2s ease-in-out 0.8s infinite; }
      .barGlint2 { animation: rmBarMove 4.2s ease-in-out 1.6s infinite; }
    ]]></style>
  </defs>

  <!-- Track line -->
  <line x1="224" y1="44" x2="700" y2="44" stroke="#10B981" stroke-width="3.5" stroke-opacity="0.7"/>
  <line x1="700" y1="44" x2="1176" y2="44" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="6 6" stroke-opacity="0.6"/>

  
  <!-- Timeline node -->
  <line x1="224" y1="44" x2="224" y2="94" stroke="#10B981" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="224" cy="44" r="20" fill="#0D1117" stroke="#10B981" stroke-width="2"/>
  <path d="M218 44 l4 4 l8 -8" fill="none" stroke="#10B981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Phase card -->
  <g filter="url(#cardShadow)">
    <g clip-path="url(#rmc0)">
      <rect x="0" y="94" width="448" height="178" rx="18" fill="#0E131C"/>
      <circle cx="224" cy="108" r="115" fill="#10B981" fill-opacity="0.09"/>
      <rect class="rsw0" x="0" y="94" width="448" height="178" fill="url(#sheenGrad)"/>
    </g>
    <rect x="0.75" y="94.75" width="446.5" height="176.5" rx="17.5" fill="none" stroke="#10B981" stroke-opacity="0.44" stroke-width="1.5"/>

    <text x="32" y="130" class="mono" font-size="12" font-weight="800" letter-spacing="1.2" fill="#94A3B8">PHASE 01</text>
    <rect x="286" y="112" width="130" height="24" rx="4" fill="#0B1018" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="351" y="128" class="mono" font-size="11" font-weight="800" fill="#10B981" text-anchor="middle">COMPLETED</text>

    <text x="32" y="164" class="sans" font-size="21" font-weight="800" fill="#FFFFFF">Shared Blade Partials</text>
    <text x="32" y="192" class="sans" font-size="14" font-weight="400" fill="#94A3B8">Standardizing modular UI component trees</text>
    <text x="32" y="213" class="sans" font-size="14" font-weight="400" fill="#94A3B8">and reusable partials across admin panels</text>

    <rect x="32" y="238" width="384" height="8" rx="4" fill="#1E293B"/>
    <rect x="32" y="238" width="384" height="8" rx="4" fill="#10B981"/>
    <g clip-path="url(#rmBar0)">
      <rect class="barGlint0" x="-40" y="238" width="90" height="8" fill="url(#barSheen)"/>
    </g>
  </g>
  <!-- Timeline node -->
  <line x1="700" y1="44" x2="700" y2="94" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="700" cy="44" r="20" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="700" cy="44" r="6" fill="#F59E0B" class="rmPulse"/>

  <!-- Phase card -->
  <g filter="url(#cardShadow)">
    <g clip-path="url(#rmc1)">
      <rect x="476" y="94" width="448" height="178" rx="18" fill="#0E131C"/>
      <circle cx="700" cy="108" r="115" fill="#F59E0B" fill-opacity="0.09"/>
      <rect class="rsw1" x="476" y="94" width="448" height="178" fill="url(#sheenGrad)"/>
    </g>
    <rect x="476.75" y="94.75" width="446.5" height="176.5" rx="17.5" fill="none" stroke="#F59E0B" stroke-opacity="0.44" stroke-width="1.5"/>

    <text x="508" y="130" class="mono" font-size="12" font-weight="800" letter-spacing="1.2" fill="#94A3B8">PHASE 02</text>
    <rect x="762" y="112" width="130" height="24" rx="4" fill="#0B1018" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1"/>
    <text x="827" y="128" class="mono" font-size="11" font-weight="800" fill="#F59E0B" text-anchor="middle">IN PROGRESS</text>

    <text x="508" y="164" class="sans" font-size="21" font-weight="800" fill="#FFFFFF">Gym Platform PWA</text>
    <text x="508" y="192" class="sans" font-size="14" font-weight="400" fill="#94A3B8">Building member PWA frontend alongside</text>
    <text x="508" y="213" class="sans" font-size="14" font-weight="400" fill="#94A3B8">centralized tracking &amp; admin dashboard</text>

    <rect x="508" y="238" width="384" height="8" rx="4" fill="#1E293B"/>
    <rect x="508" y="238" width="261" height="8" rx="4" fill="#F59E0B"/>
    <g clip-path="url(#rmBar1)">
      <rect class="barGlint1" x="436" y="238" width="90" height="8" fill="url(#barSheen)"/>
    </g>
  </g>
  <!-- Timeline node -->
  <line x1="1176" y1="44" x2="1176" y2="94" stroke="#818CF8" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="1176" cy="44" r="20" fill="#0D1117" stroke="#818CF8" stroke-width="2"/>
  <circle cx="1176" cy="44" r="5" fill="none" stroke="#818CF8" stroke-width="2"/>

  <!-- Phase card -->
  <g filter="url(#cardShadow)">
    <g clip-path="url(#rmc2)">
      <rect x="952" y="94" width="448" height="178" rx="18" fill="#0E131C"/>
      <circle cx="1176" cy="108" r="115" fill="#818CF8" fill-opacity="0.09"/>
      <rect class="rsw2" x="952" y="94" width="448" height="178" fill="url(#sheenGrad)"/>
    </g>
    <rect x="952.75" y="94.75" width="446.5" height="176.5" rx="17.5" fill="none" stroke="#818CF8" stroke-opacity="0.44" stroke-width="1.5"/>

    <text x="984" y="130" class="mono" font-size="12" font-weight="800" letter-spacing="1.2" fill="#94A3B8">PHASE 03</text>
    <rect x="1238" y="112" width="130" height="24" rx="4" fill="#0B1018" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="1303" y="128" class="mono" font-size="11" font-weight="800" fill="#818CF8" text-anchor="middle">PLANNED</text>

    <text x="984" y="164" class="sans" font-size="21" font-weight="800" fill="#FFFFFF">Advanced React &amp; Laravel</text>
    <text x="984" y="192" class="sans" font-size="14" font-weight="400" fill="#94A3B8">Microservices architecture, queue workers</text>
    <text x="984" y="213" class="sans" font-size="14" font-weight="400" fill="#94A3B8">&amp; frontend state optimization</text>

    <rect x="984" y="238" width="384" height="8" rx="4" fill="#1E293B"/>
    <rect x="984" y="238" width="96" height="8" rx="4" fill="#818CF8"/>
    <g clip-path="url(#rmBar2)">
      <rect class="barGlint2" x="912" y="238" width="90" height="8" fill="url(#barSheen)"/>
    </g>
  </g>
</svg>
